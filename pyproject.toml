[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evolve"
version = "0.1.0"
description = "Extract and evolve reusable benchmark experiences from agent logs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "openai>=1.0.0",
  "volcengine-python-sdk[ark]>=5.0.17",
]

[project.scripts]
trace-evolve = "trace_evolve.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["trace_evolve*"]
